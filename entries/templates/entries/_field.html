{% with describedby=field.auto_id|add:"-hint" %}
<label for="{{ field.id_for_label }}">{{ field.label }}</label>
{{ field }}
{% if field.errors %}
    {% for error in field.errors %}<small class="fn-field-error" id="{{ field.auto_id }}-error">{{ error }}</small>{% endfor %}
{% elif hint %}
    <small class="fn-field-error" id="{{ describedby }}">{{ hint }}</small>
{% endif %}
{% endwith %}
