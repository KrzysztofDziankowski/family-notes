<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FamilyNotes</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f8fa;
            color: #20242a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 640px);
            border-left: 4px solid #2f6f5e;
            padding: 8px 0 8px 28px;
        }

        p {
            margin: 0 0 8px;
            color: #5d6670;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 8vw, 4rem);
            line-height: 1.05;
            letter-spacing: 0;
        }

        .status {
            margin: 0;
            color: #3d454d;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.6;
            text-transform: none;
        }

        @media (max-width: 480px) {
            main {
                padding-left: 20px;
            }
        }
    </style>
</head>
<body>
    <main>
        <p>FamilyNotes</p>
        <h1>Hello, FamilyNotes!</h1>
        <p class="status">The application is running.</p>
    </main>
</body>
</html>
