<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account status | FamilyNotes</title>
</head>
<body>
    <main>
        <h1>Account status</h1>
        {% if membership %}
            <p>{{ membership.display_name }}</p>
            <p>Role: {{ membership.get_role_display }}</p>
        {% else %}
            <p>Your family membership is not configured yet.</p>
        {% endif %}
        <nav aria-label="Account actions">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'account_logout' %}">Log out</a>
        </nav>
    </main>
</body>
</html>
